<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A focused demo for refining the Abstract Systems menu and its interaction states." />
    <title>Menu demo — Abstract Systems</title>
  </head>
  <body class="m-0 bg-white antialiased">
    <main class="grid min-h-svh place-items-center px-8">
      <div class="flex flex-col items-center gap-7">
        <div class="menu" role="group" aria-label="Menu interaction demo" aria-describedby="demo-help" data-node-id="1:3">
          <span class="menu__pill" aria-hidden="true"></span>
          <button class="menu__item" type="button" aria-pressed="true" data-node-id="1:44">
            <img class="menu__icon" src="/icons/about.svg" width="16" height="16" alt="" />
            <span>About</span>
          </button>
          <button class="menu__item" type="button" aria-pressed="false" data-node-id="1:60">
            <img class="menu__icon" src="/icons/work.svg" width="16" height="16" alt="" />
            <span>Work</span>
          </button>
          <button class="menu__item" type="button" aria-pressed="false" data-node-id="1:73">
            <img class="menu__icon" src="/icons/library.svg" width="16" height="16" alt="" />
            <span>Library</span>
          </button>
          <button class="menu__item" type="button" aria-pressed="false" data-node-id="1:80">
            <img class="menu__icon" src="/icons/stack.svg" width="16" height="16" alt="" />
            <span>Stack</span>
          </button>
        </div>
        <p id="demo-help" class="m-0 text-center text-xs leading-5 text-slate-500">Select an item to preview its interaction. This was built using the power of Codex (GPT-6.1 Sol) </p>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
